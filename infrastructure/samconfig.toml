version = 0.1

# Perfil padrao, para deploy manual com "sam deploy --guided".
# Atualiza a mesma stack de dev usada pela pipeline, porque os recursos tem nomes fixos.
[default.deploy.parameters]
stack_name = "fiap-tech-challenge-fase-4-dev"
resolve_s3 = true
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
parameter_overrides = "EnvironmentName=dev"

# Perfis usados pela pipeline. Bucket e parametros sao informados pelo workflow.
[dev.deploy.parameters]
stack_name = "fiap-tech-challenge-fase-4-dev"
region = "us-east-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false

[prod.deploy.parameters]
stack_name = "fiap-tech-challenge-fase-4-prod"
region = "us-east-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false

[default.build.parameters]
cached = true
parallel = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"
